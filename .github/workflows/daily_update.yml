name: Daily ETF Update

on:
  schedule:
    # Run every weekday at 22:00 UTC (after US market close)
    - cron: "0 22 * * 1-5"
  workflow_dispatch:  # Allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily update
        env:
          # Официален FRED API (S15 hardening). Без този secret кодът пада на
          # keyless fredgraph (bot-stalled от CI) → stale/unknown breakeven+макро.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/daily_update.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ docs/data.json docs/barometer_feed.json
          git diff --staged --quiet || git commit -m "chore: daily ETF update $(date -u +%Y-%m-%d)"
          git push
